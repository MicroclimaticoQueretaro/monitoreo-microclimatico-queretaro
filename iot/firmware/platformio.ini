; Configuración del proyecto PlatformIO para la estación meteorológica.
; Placa: ESP32 DevKit V1 (ESP32-WROOM-32), 30 pines.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad del Monitor Serial (debe coincidir con Serial.begin)
monitor_speed = 115200
; Decodifica las direcciones de memoria si el ESP32 se reinicia por un error
monitor_filters = esp32_exception_decoder

; Bibliotecas: PlatformIO las descarga automáticamente (versiones fijadas para builds reproducibles)
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7.2.0
