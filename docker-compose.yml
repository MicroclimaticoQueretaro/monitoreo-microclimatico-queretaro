# Servicios del proyecto. Uso: docker compose up -d
# Las credenciales se leen del archivo .env (copiar desde .env.example; nunca subir .env a GitHub)
services:
  db:
    # PostgreSQL 16 con la extensión TimescaleDB, optimizada para series de tiempo
    image: timescale/timescaledb:latest-pg16
    container_name: microclima_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Solo accesible desde la propia computadora (127.0.0.1), no desde la red local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL que crean el esquema la primera vez que se crea la base (solo lectura)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Verifica que la base de datos esté lista antes de que otros servicios se conecten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
