# Servicios del proyecto. Uso: docker compose up -d
# Las credenciales se leen del archivo .env (copiar desde .env.example; nunca subir .env a GitHub)
services:
  db:
    # PostgreSQL 16 con la extensión TimescaleDB, optimizada para series de tiempo
    image: timescale/timescaledb:latest-pg16
    container_name: microclima_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Solo accesible desde la propia computadora (127.0.0.1), no desde la red local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL que crean el esquema la primera vez que se crea la base (solo lectura)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Verifica que la base de datos esté lista antes de que otros servicios se conecten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    container_name: microclima_api
    # Dentro de la red de Docker, la base se llama "db" y escucha en el puerto 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Broker MQTT para activar / detener la estación desde el sitio (vacío = desactivado)
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PUERTO: ${MQTT_PUERTO:-8883}
      MQTT_USUARIO: ${MQTT_USUARIO:-}
      MQTT_CONTRASENA: ${MQTT_CONTRASENA:-}
    # Por defecto solo es accesible desde esta computadora (127.0.0.1).
    # Para que el ESP32 la alcance por WiFi, poner API_HOST_BIND=0.0.0.0 en el .env
    # (solo en redes de confianza: la API queda visible para toda la red local).
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:8000:8000"
    # La API espera a que la base de datos esté lista (healthcheck) antes de arrancar
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Descarga cada 30 min el modelo meteorológico (Open-Meteo) para calcular la brecha térmica.
  # Usa la misma imagen que la API, pero ejecuta otro comando.
  sincronizador:
    build: ./api
    container_name: microclima_sincronizador
    command: ["python", "-m", "scripts.sincronizar_modelo", "--continuo"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard React: se compila y se sirve con nginx en http://localhost:5173
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
    container_name: microclima_web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
